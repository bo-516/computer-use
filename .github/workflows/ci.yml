# Every PR (goal.md §9.5): unit tests, hook fixture tests (also on Python 3.8), facade contract
# tests against the fake backend, task-set checker tests, lint, types and vendored-code drift.
# No secrets, no network beyond package downloads, no grok sessions.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.27"
          python-version: "3.11"
          enable-cache: true
      # Dev-loop checkers run `node check.js` (eval/tests/test_oracles.py).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Sync locked environment
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Types
        run: uv run pyright
      - name: Tests
        run: uv run pytest
      - name: Vendored hooklib matches the plugin copy
        run: uv run python scripts/sync_hooklib.py --check
      - name: Hooks and probe scripts on Python 3.8
        run: |
          uv python install 3.8
          PY38="$(uv python find --no-project 3.8)"
          uv run --python 3.8 --no-project --with pytest==8.3.5 pytest tests/hooks
          PATH="$(dirname "$PY38"):$PATH" GROK_COMPUTER_TEST_PYTHON="$PY38" \
            uv run pytest eval/tests/test_phase0_probe.py
      - name: Plugin index is current
        run: uv run python scripts/plugin_index.py --check
